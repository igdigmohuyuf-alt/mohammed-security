<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOHAMMED SECURITY</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#090b10;
 color:white;
 font-family:Arial,sans-serif;
}

header{
 background:#11151d;
 padding:22px 35px;
 border-bottom:1px solid #292e38;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 font-size:22px;
 font-weight:bold;
 color:#ff3030;
}

.logo span{color:white}

.container{
 max-width:1100px;
 margin:40px auto;
 padding:20px;
}

h1{font-size:30px}

.subtitle{color:#9299a8}

.card{
 background:#121720;
 border:1px solid #292f3b;
 border-radius:12px;
 padding:25px;
 margin-top:25px;
}

input,select{
 width:100%;
 padding:14px;
 margin:10px 0;
 background:#090d14;
 border:1px solid #343b48;
 border-radius:7px;
 color:white;
 font-size:15px;
}

button{
 background:#e32935;
 color:white;
 border:0;
 padding:13px 22px;
 border-radius:7px;
 cursor:pointer;
 font-weight:bold;
}

button:hover{background:#ff414b}

.secondary{background:#303846}

#dashboard{display:none}

#message{
 margin-top:15px;
 color:#ff6060;
 overflow-wrap:anywhere;
}

table{
 width:100%;
 border-collapse:collapse;
 margin-top:20px;
}

td,th{
 padding:13px;
 border-bottom:1px solid #303744;
 text-align:center;
}

th{color:#ff5555}

#newkey{
 color:#42e88a;
 overflow-wrap:anywhere;
}

</style>
</head>

<body>

<header>
 <div class="logo">MOHAMMED <span>SECURITY</span></div>
 <div>ADMIN PANEL</div>
</header>

<div class="container">

<section id="login">

 <h1>تسجيل دخول المدير</h1>

 <p class="subtitle">
 لوحة إدارة تراخيص Mohammed Security
 </p>

 <div class="card">

  <input
   id="email"
   type="email"
   placeholder="البريد الإلكتروني"
  >

  <input
   id="password"
   type="password"
   placeholder="كلمة المرور"
  >

  <button onclick="login()">
   تسجيل الدخول
  </button>

  <p id="message"></p>

 </div>

</section>


<section id="dashboard">

 <h1>لوحة التحكم</h1>

 <p class="subtitle">
 مرحباً بك في نظام إدارة التراخيص
 </p>

 <div class="card">

  <h2>إنشاء كود تفعيل جديد</h2>

  <label>مدة الاشتراك</label>

  <select id="duration">

   <option value="1">يوم واحد</option>

   <option value="30">شهر واحد</option>

   <option value="365">سنة واحدة</option>

  </select>

  <button onclick="createLicense()">
   إنشاء كود
  </button>

  <p id="newkey"></p>

 </div>


 <div class="card">

  <h2>إدارة التراخيص</h2>

  <button
   class="secondary"
   onclick="loadLicenses()"
  >
   تحديث القائمة
  </button>

  <div style="overflow-x:auto">

   <table>

    <thead>
     <tr>
      <th>الكود</th>
      <th>الحالة</th>
      <th>الإجراء</th>
     </tr>
    </thead>

    <tbody id="licenses"></tbody>

   </table>

  </div>

 </div>

 <button
  class="secondary"
  onclick="logout()"
 >
  تسجيل الخروج
 </button>

</section>

</div>


<script>

// SUPABASE SETTINGS

const SUPABASE_URL =
"https://apnsvpmsebaioulplvzl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_H8a1lx2YfBtKue7g4u76Ew_kYCv_K19";

const FUNCTION_URL =
SUPABASE_URL + "/functions/v1/admin-license-manager";

let token = "";


// READ SERVER RESPONSE SAFELY

async function readResponse(response){

 const text = await response.text();

 let data;

 try{

  data = JSON.parse(text);

 }catch{

  throw new Error(
   "الخادم أرسل HTML بدل JSON. HTTP: "
   + response.status
   + " | "
   + text.substring(0,180)
  );

 }

 if(!response.ok){

  throw new Error(
   data.msg ||
   data.message ||
   data.error_description ||
   data.error ||
   "حدث خطأ في الاتصال"
  );

 }

 return data;

}


// ADMIN LOGIN

async function login(){

 const email =
 document.getElementById("email").value.trim();

 const password =
 document.getElementById("password").value;

 const msg =
 document.getElementById("message");

 if(!email || !password){

  msg.textContent =
  "يرجى إدخال البريد الإلكتروني وكلمة المرور";

  return;

 }

 msg.textContent = "جاري تسجيل الدخول...";

 try{

  const response = await fetch(
   SUPABASE_URL + "/auth/v1/token?grant_type=password",
   {
    method:"POST",

    headers:{
     "Content-Type":"application/json",
     "apikey":SUPABASE_KEY
    },

    body:JSON.stringify({
     email:email,
     password:password
    })

   }
  );

  const data = await readResponse(response);

  token = data.access_token;

  document.getElementById("login").style.display =
  "none";

  document.getElementById("dashboard").style.display =
  "block";

  msg.textContent = "";

  loadLicenses();

 }catch(error){

  msg.textContent = error.message;

 }

}


// API REQUEST

async function api(body){

 if(!token){

  throw new Error("يرجى تسجيل الدخول أولاً");

 }

 const response = await fetch(
  FUNCTION_URL,
  {
   method:"POST",

   headers:{
    "Content-Type":"application/json",
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+token
   },

   body:JSON.stringify(body)

  }
 );

 return await readResponse(response);

}


// CREATE LICENSE

async function createLicense(){

 try{

  const duration =
  Number(document.getElementById("duration").value);

  const data = await api({

   action:"create",

   duration_days:duration

  });

  document.getElementById("newkey").textContent =
  "كود التفعيل: " +
  (data.key || data.license_key || JSON.stringify(data));

  await loadLicenses();

 }catch(error){

  alert(error.message);

 }

}


// LOAD LICENSES

async function loadLicenses(){

 try{

  const data = await api({
   action:"list"
  });

  const rows = data.licenses || data;

  if(!Array.isArray(rows)){

   throw new Error("تنسيق قائمة التراخيص غير صحيح");

  }

  document.getElementById("licenses").innerHTML =
  rows.map(x=>`

   <tr>

    <td>
     ${x.key || x.license_key || x.id}
    </td>

    <td>
     ${x.status || "غير معروف"}
    </td>

    <td>
     <button onclick="disableLicense('${x.id}')">
      تعطيل
     </button>
    </td>

   </tr>

  `).join("");

 }catch(error){

  alert(error.message);

 }

}


// DISABLE LICENSE

async function disableLicense(id){

 if(!confirm("هل تريد تعطيل هذا الترخيص؟")){

  return;

 }

 try{

  await api({

   action:"disable",

   id:id

  });

  await loadLicenses();

 }catch(error){

  alert(error.message);

 }

}


// LOGOUT

function logout(){

 token = "";

 document.getElementById("dashboard").style.display =
 "none";

 document.getElementById("login").style.display =
 "block";

 document.getElementById("password").value = "";

}

</script>

<footer style="
 text-align:center;
 padding:25px;
 color:#777;
 border-top:1px solid #292e38;
">
 © 2026 Mohammed — All Rights Reserved
</footer>

</body>
</html>
